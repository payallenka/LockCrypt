spring.application.name=MySQLHandle
server.port=${PORT:7500}

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/MonolithModelPasswordManager?createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# shared secret, VaadinFramework sends it with every request
lockcrypt.internal-token=${INTERNAL_TOKEN}
