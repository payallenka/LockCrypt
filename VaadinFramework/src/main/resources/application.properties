spring.application.name=VaadinFramework
server.port=${PORT:7000}

# login accounts, a separate database from the one MySQLHandle uses for keys
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/LockCryptUsers?createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
# notice newly started services within seconds instead of the default ~30s
eureka.client.registry-fetch-interval-seconds=10
spring.cloud.loadbalancer.cache.ttl=10s

# Eureka service names, resolved by the @LoadBalanced RestTemplate
lockcrypt.services.mongodb-database=http://MongoDBDatabase
lockcrypt.services.mysql-handle=http://MySQLHandle

# shared secret sent to MongoDBDatabase and MySQLHandle with every request
lockcrypt.internal-token=${INTERNAL_TOKEN}

vaadin.allowed-packages=com.lockcrypt.vaadinframework
