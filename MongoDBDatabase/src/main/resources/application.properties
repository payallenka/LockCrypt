spring.application.name=MongoDBDatabase
server.port=${PORT:8000}

# point MONGODB_URI at Atlas or any other cluster, never commit real credentials here
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/LockCrypt}
spring.data.mongodb.auto-index-creation=true

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# shared secret, VaadinFramework sends it with every request
lockcrypt.internal-token=${INTERNAL_TOKEN}
